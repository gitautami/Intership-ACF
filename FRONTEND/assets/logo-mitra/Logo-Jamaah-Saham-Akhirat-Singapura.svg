<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="380" height="90">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>
  </defs>

  <!-- Left Emblem -->
  <g transform="translate(4, 3)">
    <!-- Outer Gold Ring -->
    <circle cx="42" cy="42" r="41" fill="#F0FDF4" stroke="url(#goldGrad)" stroke-width="2.5" />
    <circle cx="42" cy="42" r="36" fill="url(#greenGrad)" />
    
    <!-- Crescent Moon in Gold -->
    <path d="M42 14 C28 14 16 26 16 41 C16 56 28 68 42 68 C34 64 28 53 28 41 C28 29 34 18 42 14 Z" fill="#FBBF24" opacity="0.95" />
    
    <!-- Star -->
    <polygon points="43,23 45,27 50,27 46,30 48,35 43,32 39,35 41,30 37,27 42,27" fill="#FDE68A" />
    
    <!-- Leaf / Seedling of Good Deeds -->
    <path d="M49 58 C49 47 55 42 61 38 C61 47 57 55 49 58 Z" fill="#34D399" />
    <path d="M47 58 C47 49 41 44 36 41 C37 49 41 55 47 58 Z" fill="#6EE7B7" />
    <circle cx="48" cy="37" r="3" fill="#FDE68A" />
  </g>

  <!-- Right Typography -->
  <g transform="translate(100, 8)">
    <text x="0" y="16" font-family="'Poppins', sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.8" fill="#D97706">KOMUNITAS DONATUR</text>
    <text x="0" y="44" font-family="'Poppins', sans-serif" font-size="20.5" font-weight="800" fill="#065F46" letter-spacing="0.4">JAMA'AH SAHAM AKHIRAT</text>
    <text x="0" y="68" font-family="'Poppins', sans-serif" font-size="14.5" font-weight="800" fill="#1E293B" letter-spacing="3.2">SINGAPURA</text>
  </g>
</svg>
