<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 100" width="380" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>
  </defs>

  <!-- Left Emblem -->
  <g transform="translate(10, 5)">
    <!-- Outer Gold Ring -->
    <circle cx="45" cy="45" r="42" fill="#F0FDF4" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="45" cy="45" r="37" fill="url(#greenGrad)" />
    
    <!-- Crescent Moon in Gold -->
    <path d="M45 16 C30 16 18 28 18 43 C18 58 30 70 45 70 C37 66 31 55 31 43 C31 31 37 20 45 16 Z" fill="#FBBF24" opacity="0.95" />
    
    <!-- Star -->
    <polygon points="46,25 48,29 53,29 49,32 51,37 46,34 42,37 44,32 40,29 45,29" fill="#FDE68A" />
    
    <!-- Leaf / Seedling of Good Deeds -->
    <path d="M52 61 C52 50 58 45 64 41 C64 50 60 58 52 61 Z" fill="#34D399" />
    <path d="M50 61 C50 52 44 47 39 44 C40 52 44 58 50 61 Z" fill="#6EE7B7" />
    <circle cx="51" cy="40" r="3" fill="#FDE68A" />
  </g>

  <!-- Right Typography -->
  <g transform="translate(110, 15)">
    <text x="0" y="16" font-family="'Poppins', 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="#D97706">KOMUNITAS DONATUR</text>
    <text x="0" y="42" font-family="'Poppins', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="800" fill="#065F46" letter-spacing="0.2">JAMA'AH SAHAM AKHIRAT</text>
    <text x="0" y="64" font-family="'Poppins', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#1E293B" letter-spacing="2.5">SINGAPURA</text>
  </g>
</svg>